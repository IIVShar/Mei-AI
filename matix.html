<!DOCTYPE html>
<html lang="en" class="dark">
<head>

     <link rel="icon" type="image/png" sizes="32x32" href=.matix.html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matix AI Canvas Studio - Interactive Visual Synthesizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #08090d;
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(15, 18, 28, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            transition: all 0.25s ease;
        }
        .glass-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
        }
        .glass-input {
            background: rgba(10, 12, 20, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
        }
        .glass-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
            outline: none;
        }
        .glow-button {
            position: relative;
            transition: all 0.3s ease;
        }
        .glow-button::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, #6366f1, #a855f7, #ec4899, #6366f1);
            border-radius: inherit;
            z-index: -1;
            filter: blur(8px);
            opacity: 0.6;
            transition: opacity 0.3s ease;
            background-size: 300% 300%;
            animation: moveGradient 4s ease infinite;
        }
        .glow-button:hover::before {
            opacity: 1;
        }
        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(10, 12, 20, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-[#08090d] text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-purple-500 selection:text-white">

    <!-- Header Navigation -->
    <header class="glass-panel sticky top-0 z-40 px-4 lg:px-8 py-3.5 flex items-center justify-between border-b border-white/10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 via-fuchsia-500 to-pink-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
                <i class="fa-solid fa-paintbrush text-white text-lg"></i>
            </div>
            <div>
                <h1 class="text-xl font-extrabold bg-gradient-to-r from-white via-indigo-200 to-purple-400 bg-clip-text text-transparent tracking-tight">
                    Matix AI Canvas Studio
                </h1>
                <p class="text-xs text-slate-400">Interactive Generative AI Canvas & Drawing Suite</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="downloadCanvasArtwork()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 transition-colors flex items-center gap-1.5 shadow-lg shadow-indigo-600/30">
                <i class="fa-solid fa-download"></i>
                <span>Download Artwork</span>
            </button>
            <button onclick="clearCanvasBackground()" class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 transition-colors flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-right"></i>
                <span class="hidden sm:inline">Reset</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Controls Sidebar -->
        <section class="lg:col-span-4 flex flex-col gap-5">
            <div class="glass-panel p-5 rounded-2xl flex flex-col gap-4 shadow-xl">
                <label for="promptInput" class="text-sm font-semibold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-pen-nib text-indigo-400"></i>
                    AI Prompt & Synthesizer
                </label>
                <textarea id="promptInput" rows="3" class="w-full glass-input rounded-xl p-3.5 text-sm resize-none focus:outline-none" placeholder="Describe your vision (e.g., Cyberpunk Neon Nexus Grid)...">Cyberpunk Neon Nexus Grid</textarea>
                
                <button id="generateBtn" onclick="synthesizeAICanvas()" class="glow-button w-full py-3 px-6 rounded-xl bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 text-white font-bold text-sm tracking-wide shadow-lg flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-bolt text-amber-300"></i>
                    <span>Generate & Paint AI Canvas</span>
                </button>
            </div>

            <!-- Drawing & FX Tools Panel (Initially Locked/Hidden until Edit Mode is toggled) -->
            <div id="editToolsPanel" class="glass-panel p-5 rounded-2xl flex flex-col gap-4 shadow-xl opacity-50 pointer-events-none transition-all duration-300">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-semibold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-indigo-400"></i>
                        Canvas Drawing Tools
                    </label>
                    <span id="editModeBadge" class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full border border-amber-500/30 font-bold">Locked</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setTool('brush')" id="tool-brush" class="tool-btn py-2 px-3 rounded-xl bg-indigo-500/20 border border-indigo-500 text-xs font-semibold text-white">AI Brush</button>
                    <button onclick="setTool('neon')" id="tool-neon" class="tool-btn py-2 px-3 rounded-xl bg-white/5 border border-white/10 text-xs font-semibold text-slate-400">Neon Glow</button>
                    <button onclick="setTool('glitch')" id="tool-glitch" class="tool-btn py-2 px-3 rounded-xl bg-white/5 border border-white/10 text-xs font-semibold text-slate-400">Cyber Glitch</button>
                    <button onclick="setTool('eraser')" id="tool-eraser" class="tool-btn py-2 px-3 rounded-xl bg-white/5 border border-white/10 text-xs font-semibold text-slate-400">Eraser</button>
                </div>

                <div class="flex items-center justify-between pt-2 border-t border-white/10">
                    <span class="text-xs text-slate-400">Brush Size</span>
                    <input type="range" id="brushSize" min="2" max="40" value="12" class="accent-indigo-500 cursor-pointer">
                </div>
            </div>
        </section>

        <!-- Interactive Canvas Viewport -->
        <section class="lg:col-span-8 flex flex-col gap-4">
            <div class="glass-panel p-3 rounded-2xl relative overflow-hidden shadow-2xl flex flex-col items-center justify-center min-h-[520px]">
                <div class="absolute top-6 right-6 z-20">
                    <button id="editToggleBtn" onclick="toggleEditMode()" class="px-3.5 py-2 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-white/20 text-xs font-bold text-slate-200 transition-all shadow-xl flex items-center gap-2 backdrop-blur-md">
                        <i class="fa-solid fa-pen-to-square text-indigo-400" id="editIcon"></i>
                        <span id="editText">Enable Edit Mode</span>
                    </button>
                </div>

                <canvas id="studioCanvas" class="w-full h-[500px] rounded-xl cursor-default bg-slate-950 shadow-2xl border border-white/10"></canvas>
                
                <!-- Status Overlay -->
                <div class="absolute top-6 left-6 bg-slate-900/90 border border-white/10 px-3 py-1.5 rounded-lg text-xs font-medium text-indigo-200 backdrop-blur-md pointer-events-none flex items-center gap-2" id="canvasStatus">
                    <i class="fa-solid fa-circle-check text-emerald-400"></i>
                    <span>Status: Ready to Generate AI Art (Edit Mode Locked)</span>
                </div>
            </div>
        </section>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 max-w-md bg-slate-900 border border-indigo-500/40 text-slate-100 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3">
        <i id="toastIcon" class="fa-solid fa-circle-check text-indigo-400"></i>
        <span id="toastMessage" class="text-xs font-medium">Notification</span>
    </div>

    <script>
        const canvas = document.getElementById('studioCanvas');
        const ctx = canvas.getContext('2d');
        let currentTool = 'brush';
        let isDrawing = false;
        let isEditModeActive = false;
        let lastX = 0;
        let lastY = 0;
        let currentImageLoaded = false;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth - 24;
            canvas.height = 500;
            if (!currentImageLoaded) {
                drawDefaultBackground();
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawDefaultBackground() {
            ctx.fillStyle = '#0b0f19';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(99, 102, 241, 0.15)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            ctx.fillStyle = '#818cf8';
            ctx.font = 'bold 18px Plus Jakarta Sans, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("Synthesize an AI prompt (Click 'Enable Edit Mode' to draw)", canvas.width / 2, canvas.height / 2 - 10);
        }

        function toggleEditMode() {
            isEditModeActive = !isEditModeActive;
            const panel = document.getElementById('editToolsPanel');
            const badge = document.getElementById('editModeBadge');
            const btn = document.getElementById('editToggleBtn');
            const icon = document.getElementById('editIcon');
            const text = document.getElementById('editText');

            if (isEditModeActive) {
                panel.classList.remove('opacity-50', 'pointer-events-none');
                badge.className = "text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-500/30 font-bold";
                badge.innerText = "Unlocked";
                btn.className = "px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 border border-indigo-400 text-xs font-bold text-white transition-all shadow-xl flex items-center gap-2 backdrop-blur-md";
                icon.className = "fa-solid fa-lock-open text-white";
                text.innerText = "Disable Edit Mode";
                canvas.classList.remove('cursor-default');
                canvas.classList.add('cursor-crosshair');
                showToast("Canvas Edit Mode Enabled!", "success");
            } else {
                panel.classList.add('opacity-50', 'pointer-events-none');
                badge.className = "text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full border border-amber-500/30 font-bold";
                badge.innerText = "Locked";
                btn.className = "px-3.5 py-2 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-white/20 text-xs font-bold text-slate-200 transition-all shadow-xl flex items-center gap-2 backdrop-blur-md";
                icon.className = "fa-solid fa-pen-to-square text-indigo-400";
                text.innerText = "Enable Edit Mode";
                canvas.classList.add('cursor-default');
                canvas.classList.remove('cursor-crosshair');
                showToast("Canvas Edit Mode Locked", "info");
            }
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => {
                b.className = 'tool-btn py-2 px-3 rounded-xl bg-white/5 border border-white/10 text-xs font-semibold text-slate-400';
            });
            document.getElementById(`tool-${tool}`).className = 'tool-btn py-2 px-3 rounded-xl bg-indigo-500/20 border border-indigo-500 text-xs font-semibold text-white';
            showToast(`Selected tool: ${tool.toUpperCase()}`, "info");
        }

        canvas.addEventListener('mousedown', (e) => {
            if (!isEditModeActive) return;
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isEditModeActive || !isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const size = document.getElementById('brushSize').value;

            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (currentTool === 'brush') {
                ctx.strokeStyle = '#6366f1';
                ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
            } else if (currentTool === 'neon') {
                ctx.strokeStyle = '#ec4899';
                ctx.shadowColor = '#a855f7';
                ctx.shadowBlur = 15;
                ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
                ctx.shadowBlur = 0;
            } else if (currentTool === 'glitch') {
                ctx.strokeStyle = '#10b981';
                ctx.beginPath(); ctx.moveTo(lastX + (Math.random() * 10 - 5), lastY); ctx.lineTo(x + (Math.random() * 10 - 5), y); ctx.stroke();
            } else if (currentTool === 'eraser') {
                ctx.strokeStyle = '#0b0f19';
                ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
            }

            lastX = x;
            lastY = y;
        });

        window.addEventListener('mouseup', () => { isDrawing = false; });

        async function loadImageElement(url, timeoutMs = 6000) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                const timer = setTimeout(() => reject(new Error('Timeout')), timeoutMs);
                img.onload = () => {
                    clearTimeout(timer);
                    resolve(img);
                };
                img.onerror = (err) => {
                    clearTimeout(timer);
                    reject(err);
                };
                img.src = url + (url.includes('?') ? '&' : '?') + `_t=${Date.now()}`;
            });
        }

        async function validateImageQuality(img) {
            const checkCanvas = document.createElement('canvas');
            checkCanvas.width = 100;
            checkCanvas.height = 100;
            const checkCtx = checkCanvas.getContext('2d');
            try {
                checkCtx.drawImage(img, 0, 0, 100, 100);
                const data = checkCtx.getImageData(10, 10, 80, 80).data;
                let yellowCount = 0;
                let totalPixels = data.length / 4;
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i+1], b = data[i+2];
                    if (r > 200 && g > 180 && b < 100) yellowCount++;
                }
                if ((yellowCount / totalPixels) > 0.35) return false;
            } catch (e) {
                return false;
            }
            return true;
        }

        async function fetchPollinationsImage(prompt, w, h, seed) {
            const cleanPrompt = encodeURIComponent(prompt.trim() + ", extremely accurate subject matter, high quality");
            const models = ['flux', 'turbo'];
            for (const model of models) {
                const rawUrl = `https://image.pollinations.ai/prompt/${cleanPrompt}?width=${w}&height=${h}&seed=${seed}&model=${model}&nologo=true`;
                try {
                    const img = await loadImageElement(rawUrl, 6000);
                    if (await validateImageQuality(img)) {
                        return img;
                    }
                } catch (e) {
                    console.warn(`Pollinations ${model} failed, cascading...`);
                }
            }
            throw new Error("Pollinations limit reached");
        }

        async function fetchLexicaImage(prompt) {
            const res = await fetch(`https://lexica.art/api/v1/search?q=${encodeURIComponent(prompt)}`);
            if (res.ok) {
                const data = await res.json();
                if (data?.images?.length > 0) {
                    return await loadImageElement(data.images[0].src, 5000);
                }
            }
            throw new Error("Lexica failed");
        }

        async function fetchStockImage(prompt, w, h) {
            let hash = 0;
            for (let i = 0; i < prompt.length; i++) {
                hash = (hash << 5) - hash + prompt.charCodeAt(i);
                hash |= 0;
            }
            const seedVal = Math.abs(hash % 900) + 100;
            return await loadImageElement(`https://picsum.photos/seed/${seedVal}/${w}/${h}`, 5000);
        }

        async function synthesizeAICanvas() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) {
                showToast("Please enter an AI prompt", "warning");
                return;
            }

            document.getElementById('canvasStatus').innerHTML = `<i class="fa-solid fa-circle-notch animate-spin text-indigo-400"></i><span>Synthesizing artwork via AI Engines & Stock fallback...</span>`;
            
            let loadedImg = null;
            const seed = Math.floor(Math.random() * 999999);

            try {
                try {
                    loadedImg = await fetchPollinationsImage(prompt, canvas.width, canvas.height, seed);
                } catch (e) {
                    console.warn("Pollinations failed, trying Lexica...");
                    try {
                        loadedImg = await fetchLexicaImage(prompt);
                    } catch (err) {
                        console.warn("Lexica failed, using stock photo fallback...");
                        loadedImg = await fetchStockImage(prompt, canvas.width, canvas.height);
                    }
                }

                if (loadedImg) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(loadedImg, 0, 0, canvas.width, canvas.height);
                    currentImageLoaded = true;
                    document.getElementById('canvasStatus').innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i><span>AI Artwork Painted Successfully</span>`;
                    showToast("AI artwork synthesized onto canvas!", "success");
                }
            } catch (err) {
                showToast("Generation failed. Please try again.", "warning");
                document.getElementById('canvasStatus').innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-400"></i><span>Generation Failed - Retry</span>`;
            }
        }

        function clearCanvasBackground() {
            currentImageLoaded = false;
            drawDefaultBackground();
            showToast("Canvas reset", "info");
        }

        function downloadCanvasArtwork() {
            const link = document.createElement('a');
            link.download = 'matix-ai-canvas.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
            showToast("Canvas artwork downloaded!", "success");
        }

        function showToast(message, type = "info") {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.innerText = message;
            if (type === "success") toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            else if (type === "warning") toastIcon.className = "fa-solid fa-triangle-exclamation text-amber-400";
            else toastIcon.className = "fa-solid fa-circle-info text-indigo-400";

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }
    </script>
</body>
</html>
