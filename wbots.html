<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mei AI - Explore Custom Wbots</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gemini: {
                            bg: '#131314',
                            sidebar: '#1e1e20',
                            card: '#282a2c',
                            cardHover: '#333538',
                            userBubble: '#2b2d30',
                            accent: '#a8c7fa',
                            border: '#3c4043'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .markdown-body pre { background: #0d1117; color: #e6edf3; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.75rem 0; font-size: 0.875rem; border: 1px solid #30363d; position: relative; }
        .markdown-body code { font-family: monospace; background: #2d333b; padding: 0.125rem 0.25rem; border-radius: 0.25rem; color: #f472b6; }
        .markdown-body pre code { background: transparent; padding: 0; color: #e6edf3; }
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.6; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; color: #f8fafc; }
    </style>
</head>
<body class="bg-gemini-bg text-gray-100 font-sans h-screen flex overflow-hidden">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-64 bg-gemini-sidebar flex flex-col justify-between border-r border-gray-800 transition-all duration-300 z-20">
        <!-- Top: Logo & Explore Nav -->
        <div class="p-3 flex flex-col gap-3">
            <div class="flex items-center justify-between px-2 py-1">
                <div class="flex items-center gap-2.5 cursor-pointer" onclick="showExploreView()">
                    <!-- Exact Vertical Glowing Multi-Color Pill Gradient Logo -->
                    <div class="relative flex items-center justify-center w-7 h-8">
                        <div class="absolute inset-y-0 w-2.5 bg-gradient-to-b from-blue-500 via-purple-500 to-pink-500 rounded-full blur-[3px] opacity-80"></div>
                        <div class="relative w-2 h-7 rounded-full bg-gradient-to-b from-blue-400 via-purple-500 to-pink-500 shadow-md"></div>
                    </div>
                    <span class="font-semibold text-base tracking-tight text-gray-200">Mei AI</span>
                </div>
                <button onclick="toggleSidebar()" class="text-gray-400 hover:text-white p-2 rounded-lg hover:bg-gray-800 transition">
                    <i class="fa-solid fa-bars text-sm"></i>
                </button>
            </div>

            <!-- Explore Custom Wbots Navigation Button -->
            <button onclick="showExploreView()" class="flex items-center gap-3 bg-gray-800/80 hover:bg-gray-800 text-gray-200 px-3.5 py-2.5 rounded-full text-sm font-medium transition border border-gray-700/50 shadow-sm">
                <i class="fa-solid fa-compass text-blue-400"></i>
                <span>Explore Custom Wbots</span>
            </button>
        </div>

        <!-- Middle: Recent Wbot Sessions History List -->
        <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1">
            <div class="text-xs font-semibold text-gray-400 px-3 mb-2 uppercase tracking-wider">Recent Wbot Sessions</div>
            <div id="sessionHistoryList" class="space-y-1">
                <!-- Dynamically populated from localStorage -->
            </div>
        </div>
    </aside>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-gemini-bg relative">

        <!-- VIEW 1: EXPLORE DIRECTORY -->
        <div id="exploreView" class="flex-1 flex flex-col h-full overflow-y-auto p-6 md:p-10">
            <div class="max-w-5xl mx-auto w-full mb-8">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white mb-1">Explore Custom Wbots</h1>
                        <p class="text-sm text-gray-400">Discover specialized AI personas built for tutoring, coding, chess strategy, and creative writing.</p>
                    </div>
                    <!-- Real-time search filtering -->
                    <div class="relative w-full md:w-72">
                        <i class="fa-solid fa-search absolute left-3.5 top-3 text-gray-400 text-sm"></i>
                        <input type="text" id="wbotSearch" placeholder="Search Wbots..." oninput="filterWbots()" 
                            class="w-full bg-gemini-card text-sm text-gray-200 placeholder-gray-400 pl-10 pr-4 py-2.5 rounded-xl border border-gray-700/60 focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>
                <hr class="border-gray-800">
            </div>

            <!-- Wbots Responsive Grid -->
            <div class="max-w-5xl mx-auto w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 pb-12" id="wbotsGrid">
                <!-- Populated via JavaScript -->
            </div>
        </div>

        <!-- VIEW 2: INTERACTIVE CHAT WORKSPACE -->
        <div id="chatView" class="hidden flex-1 flex flex-col h-full overflow-hidden">
            <!-- Chat Header -->
            <div class="h-14 px-6 border-b border-gray-800 flex items-center justify-between bg-gemini-bg/80 backdrop-blur z-10">
                <div class="flex items-center gap-3">
                    <button onclick="showExploreView()" class="text-gray-400 hover:text-white p-2 rounded-lg hover:bg-gray-800 transition text-sm flex items-center gap-2">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span class="hidden sm:inline">Back to Explore</span>
                    </button>
                    <div class="h-4 w-px bg-gray-800"></div>
                    <div class="flex items-center gap-2.5">
                        <div id="activeWbotAvatar" class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-sm font-bold shadow">
                            <i class="fa-solid fa-robot"></i>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h2 id="activeWbotTitle" class="text-sm font-semibold text-white">Custom Wbot</h2>
                                <!-- Vertical Pill Gradient Logo Badge in Header -->
                                <div class="relative flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-gray-800/80 border border-gray-700/50">
                                    <div class="relative w-1.5 h-3.5 rounded-full bg-gradient-to-b from-blue-400 via-purple-500 to-pink-500 shadow-sm"></div>
                                    <span class="font-normal text-[9px] text-gray-300">Mei AI</span>
                                </div>
                            </div>
                            <p id="activeWbotCategory" class="text-[10px] text-gray-400">Active Custom Persona</p>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="clearCurrentChat()" class="text-gray-400 hover:text-white text-xs px-3 py-1.5 rounded-lg hover:bg-gray-800 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-rotate-right"></i> Reset Chat
                    </button>
                </div>
            </div>

            <!-- Scrollable Chat Messages Container -->
            <div id="chatMessages" class="flex-1 overflow-y-auto px-4 md:px-24 py-6 space-y-6">
                <!-- Dynamic messages appear here -->
            </div>

            <!-- Chat Input Area -->
            <div class="p-4 md:px-24 bg-gemini-bg">
                <div class="max-w-4xl mx-auto bg-gemini-card rounded-2xl border border-gray-700/60 p-3 shadow-lg focus-within:border-blue-500 transition">
                    <textarea id="chatInput" rows="1" placeholder="Message custom Wbot..." onkeydown="handleKeydown(event)"
                        class="w-full bg-transparent text-gray-100 placeholder-gray-400 text-sm resize-none focus:outline-none max-h-32"></textarea>
                    <div class="flex items-center justify-between mt-2 pt-2 border-t border-gray-700/40">
                        <div class="flex items-center gap-1 text-gray-400 text-xs">
                            <span id="activeWbotModelBadge" class="px-2 py-0.5 rounded bg-gray-800 text-gray-300 font-mono text-[10px]">Mei Custom Wbot</span>
                        </div>
                        <button onclick="sendMessage()" id="sendBtn" class="bg-blue-600 hover:bg-blue-500 text-white w-8 h-8 rounded-xl flex items-center justify-center transition shadow">
                            <i class="fa-solid fa-paper-plane text-xs"></i>
                        </button>
                    </div>
                </div>
                <div class="text-center mt-2 text-[11px] text-gray-500">
                    Custom Wbots can make mistakes. Verify important information.
                </div>
            </div>
        </div>

    </main>

    <!-- CLIENT SCRIPT -->
    <script>
        // Curated Custom Wbots Directory Data
        const wbots = [
            {
                id: 'duo',
                name: 'Duo',
                category: 'Language Learning',
                description: 'Your friendly and persistent language companion ready to practice vocabulary, grammar, and conversational fluency.',
                icon: 'fa-language',
                color: 'from-emerald-500 to-teal-600',
                greeting: "Hello! Ready to practice a new language today? What language or vocabulary would you like to explore?"
            },
            {
                id: 'oscar',
                name: 'Oscar',
                category: 'Chess Coach',
                description: 'Expert chess tactician and coach. Analyzes openings, positional strategies, and tactical puzzles for all skill levels.',
                icon: 'fa-chess',
                color: 'from-amber-600 to-yellow-600',
                greeting: "Welcome to the board! I'm Oscar, your chess coach. Whether you want to review an opening, analyze a tactical puzzle, or discuss strategy, let's make our move!"
            },
            {
                id: 'math-tutor',
                name: 'Math Tutor',
                category: 'Education & Pedagogy',
                description: 'Specializes in elementary and junior mathematics pedagogy, fractions, word problems, and curriculum-aligned explanations.',
                icon: 'fa-calculator',
                color: 'from-blue-500 to-indigo-600',
                greeting: "Hello! I am your Math Tutor Wbot. Whether you're working through junior math problems, fractions, or curriculum concepts, how can I help you solve it today?"
            },
            {
                id: 'python-coder',
                name: 'Python Coder',
                category: 'Software Development',
                description: 'Expert in Python programming, script automation, data manipulation, debugging, and clean architecture guidelines.',
                icon: 'fa-code',
                color: 'from-purple-500 to-pink-600',
                greeting: "Hello! I'm your Python Coder Wbot. Paste your snippet or describe your script requirement, and let's write clean, efficient code."
            },
            {
                id: 'roblox-luau',
                name: 'Roblox Luau Scripter',
                category: 'Game Development',
                description: 'Specializes in Roblox Studio Luau scripting, custom badge systems, client-server remotes, and interactive UI frameworks.',
                icon: 'fa-gamepad',
                color: 'from-red-500 to-orange-600',
                greeting: "Hey developer! Ready to build in Roblox Studio? Let's write custom Luau mechanics, data stores, or UI event handlers."
            },
            {
                id: 'physics-expert',
                name: 'Physics Expert',
                category: 'Science',
                description: 'Breaks down mechanics, thermodynamics, electricity, and quantum concepts with clear analogies and step-by-step logic.',
                icon: 'fa-atom',
                color: 'from-cyan-500 to-blue-600',
                greeting: "Greetings! I'm your Physics Expert Wbot. What physical phenomenon or problem shall we analyze today?"
            },
            {
                id: 'history-scholar',
                name: 'History Scholar',
                category: 'Humanities',
                description: 'Explores world history events, civilizations, timelines, and primary source context with rich detail and objectivity.',
                icon: 'fa-landmark',
                color: 'from-amber-500 to-orange-700',
                greeting: "Welcome! Let's explore the archives of human history. Which era, civilization, or historical event would you like to investigate?"
            },
            {
                id: 'web-developer',
                name: 'Web Developer',
                category: 'Full-Stack Development',
                description: 'Expert in HTML, Tailwind CSS, JavaScript, and Node.js backend routing for rapid prototyping and deployment.',
                icon: 'fa-laptop-code',
                color: 'from-violet-600 to-fuchsia-600',
                greeting: "Hi there! I'm your Web Developer Wbot. Need help structuring markup, styling with Tailwind CSS, or setting up a server? Let's build!"
            }
        ];

        let activeWbot = null;
        let chatSessions = JSON.parse(localStorage.getItem('mei_wbot_sessions') || '{}');

        // Initialize Explore View Grid
        function renderWbots(list = wbots) {
            const grid = document.getElementById('wbotsGrid');
            grid.innerHTML = '';
            
            list.forEach(wbot => {
                const card = document.createElement('div');
                card.className = "bg-gemini-card hover:bg-gemini-cardHover border border-gray-800 hover:border-gray-700 rounded-2xl p-5 flex flex-col justify-between transition cursor-pointer group shadow-sm";
                card.onclick = () => selectWbot(wbot.id);
                
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr ${wbot.color} flex items-center justify-center text-white text-lg shadow-md group-hover:scale-105 transition">
                                <i class="fa-solid ${wbot.icon}"></i>
                            </div>
                            <span class="text-[10px] font-medium px-2.5 py-1 rounded-full bg-gray-800 text-gray-300 border border-gray-700/50">${wbot.category}</span>
                        </div>
                        <h3 class="text-base font-semibold text-white mb-1.5 group-hover:text-blue-400 transition">${wbot.name}</h3>
                        <p class="text-xs text-gray-400 line-clamp-3 leading-relaxed mb-4">${wbot.description}</p>
                    </div>
                    <div class="flex items-center justify-between pt-3 border-t border-gray-800/80 text-xs text-blue-400 font-medium">
                        <span>Start Chatting</span>
                        <i class="fa-solid fa-arrow-right text-[10px] transform group-hover:translate-x-1 transition"></i>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterWbots() {
            const query = document.getElementById('wbotSearch').value.toLowerCase();
            const filtered = wbots.filter(w => 
                w.name.toLowerCase().includes(query) || 
                w.category.toLowerCase().includes(query) || 
                w.description.toLowerCase().includes(query)
            );
            renderWbots(filtered);
        }

        function selectWbot(id) {
            activeWbot = wbots.find(w => w.id === id);
            if (!activeWbot) return;

            // Update Header UI
            document.getElementById('activeWbotTitle').textContent = activeWbot.name;
            document.getElementById('activeWbotCategory').textContent = activeWbot.category;
            document.getElementById('activeWbotAvatar').className = `w-8 h-8 rounded-full bg-gradient-to-tr ${activeWbot.color} flex items-center justify-center text-white text-sm font-bold shadow`;
            document.getElementById('activeWbotAvatar').innerHTML = `<i class="fa-solid ${activeWbot.icon}"></i>`;
            document.getElementById('activeWbotModelBadge').textContent = `Wbot: ${activeWbot.name}`;

            // Switch Views
            document.getElementById('exploreView').classList.add('hidden');
            document.getElementById('chatView').classList.remove('hidden');

            loadChatSession(activeWbot.id);
            updateSessionHistoryList();
        }

        function showExploreView() {
            document.getElementById('chatView').classList.add('hidden');
            document.getElementById('exploreView').classList.remove('hidden');
            activeWbot = null;
            updateSessionHistoryList();
        }

        function loadChatSession(wbotId) {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';

            if (!chatSessions[wbotId] || chatSessions[wbotId].length === 0) {
                chatSessions[wbotId] = [{
                    role: 'assistant',
                    content: activeWbot.greeting
                }];
                saveSessions();
            }

            chatSessions[wbotId].forEach(msg => {
                appendMessageNode(msg.role, msg.content, false);
            });
            scrollToBottom();
        }

        function appendMessageNode(role, text) {
            const container = document.getElementById('chatMessages');
            const isUser = role === 'user';
            
            const wrapper = document.createElement('div');
            wrapper.className = `flex gap-4 max-w-4xl mx-auto w-full ${isUser ? 'justify-end' : 'justify-start'}`;

            if (!isUser) {
                const avatar = document.createElement('div');
                avatar.className = `w-8 h-8 rounded-full bg-gradient-to-tr ${activeWbot.color} flex items-center justify-center text-white text-xs font-bold shadow flex-shrink-0 mt-1`;
                avatar.innerHTML = `<i class="fa-solid ${activeWbot.icon}"></i>`;
                wrapper.appendChild(avatar);
            }

            const bubble = document.createElement('div');
            bubble.className = isUser 
                ? 'bg-gemini-userBubble text-gray-100 px-4 py-3 rounded-2xl text-sm max-w-[85%] md:max-w-[75%] shadow-sm' 
                : 'text-gray-200 text-sm max-w-[85%] md:max-w-[75%] leading-relaxed markdown-body pt-1';

            if (isUser) {
                bubble.textContent = text;
            } else {
                bubble.innerHTML = marked.parse(text);
            }

            wrapper.appendChild(bubble);
            container.appendChild(wrapper);
            scrollToBottom();
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !activeWbot) return;

            input.value = '';
            input.style.height = 'auto';

            appendMessageNode('user', text);
            chatSessions[activeWbot.id].push({ role: 'user', content: text });
            saveSessions();
            updateSessionHistoryList();

            // Simulate intelligent assistant response
            setTimeout(() => {
                const reply = generateWbotResponse(activeWbot.id, text);
                appendMessageNode('assistant', reply);
                chatSessions[activeWbot.id].push({ role: 'assistant', content: reply });
                saveSessions();
            }, 600);
        }

        function generateWbotResponse(id, query) {
            const q = query.toLowerCase();
            if (id === 'oscar') {
                return `**Chess Analysis & Strategy:**\n\n- Examining your move regarding **${query}**, control of the center is crucial.\n- Consider developing your minor knights and bishops before pushing flank pawns.\n\nWould you like to analyze a specific opening line like the Ruy Lopez or Queen's Gambit?`;
            } else if (id === 'duo') {
                return `¡Excelente! Great effort practicing with **${query}**!\n\nStreak check: 🔥 Active!\nLet's test your vocabulary with a quick mini-challenge:\n*How do you say "Good morning, friend" in your target language?*`;
            } else if (id === 'math-tutor') {
                return `Let's break this math concept down step by step!\n\n**Solution Method:**\n1. Identify the given values.\n2. Set up the arithmetic operation.\n\nWould you like a practice problem to test your understanding?`;
            } else if (id === 'python-coder') {
                return `Here is a clean Python snippet to handle your requirement:\n\n\`\`\`python\ndef process_data(items):\n    # Filter valid records\n    return [item.strip() for item in items if item]\n\n# Example execution\nprint(process_data(["  python  ", "", "coder"]))\n\`\`\``;
            } else {
                return `That is a fascinating question about **${query}**. As your ${activeWbot.name}, I recommend exploring the core principles and breaking them down systematically. Let me know if you would like to dive deeper!`;
            }
        }

        function clearCurrentChat() {
            if (!activeWbot) return;
            chatSessions[activeWbot.id] = [{
                role: 'assistant',
                content: activeWbot.greeting
            }];
            saveSessions();
            loadChatSession(activeWbot.id);
        }

        function saveSessions() {
            localStorage.setItem('mei_wbot_sessions', JSON.stringify(chatSessions));
        }

        function updateSessionHistoryList() {
            const listContainer = document.getElementById('sessionHistoryList');
            listContainer.innerHTML = '';

            let hasSessions = false;
            wbots.forEach(wbot => {
                if (chatSessions[wbot.id] && chatSessions[wbot.id].length > 1) {
                    hasSessions = true;
                    const item = document.createElement('div');
                    const isActive = activeWbot && activeWbot.id === wbot.id;
                    item.className = `flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-medium cursor-pointer transition ${
                        isActive ? 'bg-gray-800 text-white shadow' : 'text-gray-400 hover:bg-gray-800/50 hover:text-gray-200'
                    }`;
                    item.onclick = () => selectWbot(wbot.id);

                    item.innerHTML = `
                        <div class="w-6 h-6 rounded-lg bg-gradient-to-tr ${wbot.color} flex items-center justify-center text-white text-[10px] flex-shrink-0">
                            <i class="fa-solid ${wbot.icon}"></i>
                        </div>
                        <span class="truncate flex-1">${wbot.name}</span>
                    `;
                    listContainer.appendChild(item);
                }
            });

            if (!hasSessions) {
                listContainer.innerHTML = `<div class="px-3 py-2 text-xs text-gray-500 italic">No recent chats yet. Pick a Wbot to start!</div>`;
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('w-64');
            sidebar.classList.toggle('w-16');
            // Toggle text visibility in sidebar
            sidebar.querySelectorAll('span').forEach(span => {
                if (!span.closest('.border-t')) span.classList.toggle('hidden');
            });
        }

        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // Initialize on Load
        window.addEventListener('DOMContentLoaded', () => {
            renderWbots();
            updateSessionHistoryList();
        });
    </script>
</body>
</html>
