<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mei AI</title>
    <style>
        body { margin: 0; padding: 0; background-color: #131314; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; height: 100vh; width: 100vw; display: flex; overflow: hidden; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gemini: { bg: '#131314', sidebar: '#1e1e20', card: '#282a2c', userBubble: '#2b2d30', accent: '#a8c7fa' }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .markdown-body pre { background: #0d1117; color: #e6edf3; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.75rem 0; border: 1px solid #30363d; position: relative; }
        .markdown-body code { font-family: monospace; background: #2d333b; padding: 0.125rem 0.25rem; border-radius: 0.25rem; color: #f472b6; }
        .markdown-body pre code { background: transparent; padding: 0; color: inherit; }
        .code-copy-btn { position: absolute; top: 0.5rem; right: 0.5rem; background: rgba(255, 255, 255, 0.1); color: #e6edf3; border: 1px solid rgba(255, 255, 255, 0.2); padding: 0.25rem 0.5rem; font-size: 0.75rem; border-radius: 0.375rem; cursor: pointer; }
        #sidebar { transition: transform 0.3s ease; }
        @media (max-width: 768px) {
            #sidebar { transform: translateX(-100%); position: fixed; z-index: 40; height: 100%; top: 0; left: 0; }
            #sidebar.open { transform: translateX(0); }
        }
    </style>
</head>
<body class="bg-[#f9fafb] dark:bg-gemini-bg text-gray-900 dark:text-gray-100 h-screen w-screen overflow-hidden flex font-sans m-0 p-0">
    <div id="overlay" class="hidden fixed inset-0 bg-black/70 z-30 lg:hidden"></div>

    <aside id="sidebar" class="w-72 bg-white dark:bg-gemini-sidebar flex flex-col flex-shrink-0 border-r border-gray-200 dark:border-gray-800 transition-transform duration-300 h-full">
        <div class="p-4 flex items-center justify-between">
            <button id="newChatBtn" type="button" class="w-full flex items-center gap-2 bg-gray-100 hover:bg-gray-200 dark:bg-[#282a2c] dark:hover:bg-[#333538] text-gray-800 dark:text-gray-200 px-4 py-2.5 rounded-full shadow-sm transition text-sm font-medium border border-gray-200 dark:border-gray-700/50 cursor-pointer">
                <i class="fa-solid fa-plus text-blue-500"></i> New chat
            </button>
        </div>
        <div class="px-4 pb-2">
            <button id="sidebarExploreBtn" type="button" class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#282a2c] rounded-lg transition cursor-pointer">
                <i class="fa-solid fa-compass text-purple-400"></i> Explore
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-3">
            <div class="text-xs font-semibold text-gray-400 mb-2 px-2">Recent</div>
            <ul id="historyList" class="space-y-1"></ul>
        </div>
        <div class="p-4 border-t border-gray-200 dark:border-gray-800">
            <button id="settingsOpenBtn" type="button" class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#282a2c] rounded-lg transition cursor-pointer">
                <i class="fa-solid fa-cog"></i> Settings
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative overflow-hidden">
        <header class="h-14 flex-shrink-0 flex items-center justify-between px-4 lg:px-8 border-b border-gray-200 dark:border-gray-800/60 bg-white/80 dark:bg-gemini-bg/80 backdrop-blur-md z-10">
            <div class="flex items-center gap-3">
                <button id="sidebarToggleBtn" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 p-2 rounded-full transition lg:hidden cursor-pointer">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <div class="flex items-center gap-2.5">
                    <div class="w-3.5 h-7 rounded-full bg-gradient-to-b from-[#3b82f6] via-[#8b5cf6] to-[#ec4899] shadow-[0_0_12px_rgba(168,85,247,0.7)] flex-shrink-0"></div>
                    <h1 class="text-lg font-medium text-gray-800 dark:text-gray-200">Mei AI</h1>
                </div>
                <span id="activeModelBadge" class="inline-flex items-center px-2.5 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-800 dark:bg-blue-950/80 dark:text-blue-300 border border-blue-200 dark:border-blue-800/50 ml-1">
                    Auto (20 Models Router)
                </span>
            </div>
            <div class="flex items-center gap-2">
                <button id="headerExploreBtn" type="button" class="flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-full text-gray-700 dark:text-gray-300 bg-gray-100 hover:bg-gray-200 dark:bg-[#282a2c] dark:hover:bg-[#333538] transition cursor-pointer">
                    <i class="fa-solid fa-compass text-purple-400"></i> Explore
                </button>
                <button id="clearChatBtn" type="button" class="text-red-500 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-950/30 w-10 h-10 rounded-full transition flex items-center justify-center cursor-pointer" title="Clear current chat">
                    <i class="fa-solid fa-trash-can text-lg"></i>
                </button>
            </div>
        </header>

        <div id="exploreMiniBar" class="hidden bg-white/95 dark:bg-[#18181a]/95 border-b border-gray-200 dark:border-gray-800 px-4 py-2.5 z-20 backdrop-blur-md">
            <div class="max-w-4xl mx-auto flex items-center gap-3 overflow-x-auto py-0.5">
                <span class="text-xs font-semibold text-gray-400 flex-shrink-0 uppercase tracking-wider"><i class="fa-solid fa-compass mr-1 text-purple-400"></i> Explore:</span>
                <a href="about.html" class="flex items-center gap-2 px-3.5 py-1.5 bg-gray-100 hover:bg-gray-200 dark:bg-[#282a2c] dark:hover:bg-[#333538] text-gray-800 dark:text-gray-200 rounded-full text-xs font-medium transition flex-shrink-0 border border-gray-200 dark:border-gray-700/50">
                    <i class="fa-solid fa-circle-info text-blue-400"></i> About Mei AI
                </a>
                <a href="wbots.html" class="flex items-center gap-2 px-3.5 py-1.5 bg-gray-100 hover:bg-gray-200 dark:bg-[#282a2c] dark:hover:bg-[#333538] text-gray-800 dark:text-gray-200 rounded-full text-xs font-medium transition flex-shrink-0 border border-gray-200 dark:border-gray-700/50">
                    <i class="fa-solid fa-brain text-purple-400"></i> Explore Models
                </a>
            </div>
        </div>

        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 lg:p-8 scroll-smooth pb-36 relative">
            <div id="emptyState" class="h-full flex flex-col items-center justify-center text-center max-w-2xl mx-auto">
                <div class="w-5 h-14 rounded-full bg-gradient-to-b from-[#3b82f6] via-[#8b5cf6] to-[#ec4899] shadow-[0_0_20px_rgba(168,85,247,0.8)] mb-4 animate-pulse"></div>
                <h2 class="text-3xl font-medium mb-3 text-gray-800 dark:text-gray-200">Hello, I'm Mei!</h2>
                <p class="text-sm text-gray-500 dark:text-gray-400">How can I help you today? Ask me anything, generate images, or attach files.</p>
            </div>
        </div>

        <div class="absolute bottom-0 left-0 right-0 p-4 lg:p-6 bg-gradient-to-t from-[#f9fafb] via-[#f9fafb] dark:from-gemini-bg dark:via-gemini-bg to-transparent z-20">
            <div class="max-w-4xl mx-auto relative flex flex-col bg-white dark:bg-[#1e1e20] rounded-3xl border border-gray-300 dark:border-gray-700/80 shadow-lg p-2">
                <div id="attachmentPreview" class="hidden px-3 pt-2 flex flex-wrap gap-2 items-center"></div>
                <div class="flex items-end">
                    <input type="file" id="fileInput" class="hidden" multiple accept="image/*,.txt,.pdf,.doc,.docx,.csv,.json">
                    <button id="attachBtn" type="button" class="p-3 m-1 text-gray-500 dark:text-gray-400 hover:text-blue-500 hover:bg-gray-100 dark:hover:bg-[#282a2c] rounded-full transition cursor-pointer">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                    <textarea id="messageInput" rows="1" placeholder="Message Mei..." class="w-full max-h-48 resize-none bg-transparent border-none text-gray-900 dark:text-gray-100 p-3 outline-none placeholder-gray-400"></textarea>
                    <button id="imageModeBtn" type="button" class="p-3 m-1 text-gray-500 dark:text-gray-400 hover:text-purple-500 hover:bg-gray-100 dark:hover:bg-[#282a2c] rounded-full transition cursor-pointer" title="Toggle Free Flux Image Generation Mode">
                        <i class="fa-solid fa-image"></i>
                    </button>
                    <button id="sendBtn" type="button" class="p-3 m-1 text-blue-600 dark:text-blue-400 hover:bg-gray-100 dark:hover:bg-[#282a2c] rounded-full transition cursor-pointer">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                    <button id="stopBtn" type="button" class="hidden p-3 m-1 text-red-500 hover:bg-gray-100 dark:hover:bg-[#282a2c] rounded-full transition cursor-pointer">
                        <i class="fa-solid fa-stop"></i>
                    </button>
                </div>
            </div>
            <p class="text-xs text-center text-gray-400 dark:text-gray-500 mt-3">Mei is an AI and can make mistakes.</p>
        </div>
    </main>

    <div id="settingsModal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white dark:bg-[#1e1e20] w-full max-w-md rounded-2xl border border-gray-700 shadow-2xl p-6 text-gray-800 dark:text-gray-200 m-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold">Settings & Models</h3>
                <button id="closeSettingsBtn" class="text-gray-400 hover:text-gray-200 cursor-pointer"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Appearance</label>
                    <div class="grid grid-cols-2 gap-2 p-1 bg-gray-100 dark:bg-[#282a2c] rounded-xl">
                        <button id="themeLightBtn" class="py-2 text-sm font-medium rounded-lg cursor-pointer">Light</button>
                        <button id="themeDarkBtn" class="py-2 text-sm font-medium rounded-lg cursor-pointer bg-blue-600 text-white">Dark</button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Select Model</label>
                    <select id="modelSelect" class="w-full bg-gray-50 dark:bg-[#282a2c] border border-gray-700 rounded-xl px-4 py-2.5 text-sm outline-none cursor-pointer">
                        <option value="auto">Auto (Smart Router across 20 Models)</option>
                        <option value="openai">OpenAI GPT-4o Mini</option>
                        <option value="llama">Llama 3.3 70B Instruct</option>
                        <option value="deepseek">DeepSeek V3 / R1</option>
                        <option value="mistral">Mistral Large 2</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end mt-6">
                <button id="saveSettingsBtn" class="px-5 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-500 rounded-xl cursor-pointer">Done</button>
            </div>
        </div>
    </div>

    <script>
        const SYSTEM_PROMPT = "You are Mei, a helpful, friendly AI assistant. Always identify yourself as Mei when asked about your name or identity.";
        const AUTO_20_MODELS = ['openai', 'phi-vision', 'sur', 'qwen-coder', 'mistral', 'llama', 'deepseek', 'qwen', 'gemma', 'phi'];
        let appState = {
            chats: JSON.parse(localStorage.getItem('ai_chats') || '[]'),
            currentChatId: null,
            theme: localStorage.getItem('ai_theme') || 'dark',
            model: localStorage.getItem('ai_model') || 'auto'
        };
        let isImageMode = false, currentAttachments = [], isGenerating = false, activeAbortController = null;

        function newChat() {
            const chat = { id: 'chat_' + Math.random().toString(36).substring(2, 9), title: 'New Chat', messages: [] };
            appState.chats.unshift(chat);
            appState.currentChatId = chat.id;
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('ai_chats', JSON.stringify(appState.chats));
            renderSidebar();
            renderChat();
        }

        function renderSidebar() {
            const list = document.getElementById('historyList');
            list.innerHTML = appState.chats.length === 0 ? '<li class="text-xs text-gray-400 px-2">No recent chats</li>' : '';
            appState.chats.forEach(c => {
                const li = document.createElement('li');
                li.className = `px-3 py-2 rounded-lg text-sm cursor-pointer truncate ${c.id === appState.currentChatId ? 'bg-gray-200 dark:bg-[#282a2c] font-medium' : 'text-gray-400 hover:bg-gray-100 dark:hover:bg-[#202225]'}`;
                li.textContent = c.title;
                li.onclick = () => { appState.currentChatId = c.id; renderSidebar(); renderChat(); if(window.innerWidth<1024) toggleSidebar(); };
                list.appendChild(li);
            });
        }

        function renderChat() {
            const container = document.getElementById('chatContainer');
            const empty = document.getElementById('emptyState');
            const chat = appState.chats.find(c => c.id === appState.currentChatId) || (appState.chats.length ? appState.chats[0] : null);
            if(!chat || chat.messages.length === 0) {
                empty.classList.remove('hidden');
                Array.from(container.children).forEach(el => { if(el.id !== 'emptyState') el.remove(); });
                return;
            }
            empty.classList.add('hidden');
            Array.from(container.children).forEach(el => { if(el.id !== 'emptyState') el.remove(); });
            chat.messages.forEach(m => appendDOM(m.role, m.content, false));
        }

        function appendDOM(role, content, scroll=true) {
            const container = document.getElementById('chatContainer');
            document.getElementById('emptyState').classList.add('hidden');
            const wrapper = document.createElement('div');
            wrapper.className = `flex mb-6 w-full ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            const inner = document.createElement('div');
            inner.className = `max-w-[85%] lg:max-w-[75%] rounded-2xl px-5 py-4 shadow-sm ${role === 'user' ? 'bg-gray-100 dark:bg-gemini-userBubble' : 'bg-white dark:bg-gemini-card border border-gray-800 w-full'}`;
            if(role === 'assistant') {
                inner.innerHTML = '<div class="flex items-center gap-2 mb-2 pb-2 border-b border-gray-800 text-xs font-semibold text-purple-400"><div class="w-2.5 h-5 rounded-full bg-gradient-to-b from-blue-500 to-pink-500"></div> Mei AI</div>';
            }
            const body = document.createElement('div');
            body.className = role === 'assistant' ? 'markdown-body text-sm' : 'text-sm whitespace-pre-wrap';
            if(role === 'assistant') body.innerHTML = marked.parse(content || ''); else body.textContent = content;
            inner.appendChild(body);
            wrapper.appendChild(inner);
            container.appendChild(wrapper);
            if(scroll) container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if((!text && currentAttachments.length === 0) || isGenerating) return;
            input.value = ''; input.style.height = 'auto';

            let chat = appState.chats.find(c => c.id === appState.currentChatId);
            if(!chat) { newChat(); chat = appState.chats[0]; }
            if(chat.messages.length === 0) chat.title = text.slice(0, 30);

            if(isImageMode) {
                chat.messages.push({ role: 'user', content: text });
                appendDOM('user', text);
                saveAndRender();
                const imgUrl = `https://pollinations.ai/p/${encodeURIComponent(text)}?width=1024&height=1024&nologo=true`;
                const aiResp = `Here is your generated image:\n\n![Generated](${imgUrl})`;
                chat.messages.push({ role: 'assistant', content: aiResp });
                appendDOM('assistant', aiResp);
                saveAndRender();
                isImageMode = false;
                return;
            }

            chat.messages.push({ role: 'user', content: text });
            appendDOM('user', text);
            saveAndRender();

            chat.messages.push({ role: 'assistant', content: '' });
            const idx = chat.messages.length - 1;
            appendDOM('assistant', '<span class="animate-pulse">Thinking...</span>');
            
            isGenerating = true;
            document.getElementById('sendBtn').classList.add('hidden');
            document.getElementById('stopBtn').classList.remove('hidden');
            activeAbortController = new AbortController();

            try {
                let model = appState.model === 'auto' ? AUTO_20_MODELS[Math.floor(Math.random()*AUTO_20_MODELS.length)] : appState.model;
                const res = await fetch(`https://text.pollinations.ai/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: [{role:'system', content:SYSTEM_PROMPT}, ...chat.messages.slice(0,-1)], model: model }),
                    signal: activeAbortController.signal
                });
                const fullText = await res.text();
                chat.messages[idx].content = fullText;
                saveAndRender();
            } catch(e) {
                chat.messages[idx].content = "Error generating response. Please try again.";
                saveAndRender();
            } finally {
                isGenerating = false;
                document.getElementById('sendBtn').classList.remove('hidden');
                document.getElementById('stopBtn').classList.add('hidden');
            }
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('hidden'); }

        document.addEventListener('DOMContentLoaded', () => {
            if(!appState.chats.length) newChat(); else { appState.currentChatId = appState.chats[0].id; renderSidebar(); renderChat(); }
            document.getElementById('newChatBtn').onclick = newChat;
            document.getElementById('sidebarToggleBtn').onclick = toggleSidebar;
            document.getElementById('overlay').onclick = toggleSidebar;
            document.getElementById('headerExploreBtn').onclick = () => document.getElementById('exploreMiniBar').classList.toggle('hidden');
            document.getElementById('sidebarExploreBtn').onclick = () => { toggleSidebar(); document.getElementById('exploreMiniBar').classList.toggle('hidden'); };
            document.getElementById('settingsOpenBtn').onclick = () => document.getElementById('settingsModal').classList.remove('hidden');
            document.getElementById('closeSettingsBtn').onclick = () => document.getElementById('settingsModal').classList.add('hidden');
            document.getElementById('saveSettingsBtn').onclick = () => {
                appState.model = document.getElementById('modelSelect').value;
                localStorage.setItem('ai_model', appState.model);
                document.getElementById('settingsModal').classList.add('hidden');
            };
            document.getElementById('imageModeBtn').onclick = () => { isImageMode = !isImageMode; alert(isImageMode ? "Flux Image Mode ON" : "Chat Mode ON"); };
            document.getElementById('clearChatBtn').onclick = () => {
                const c = appState.chats.find(x => x.id === appState.currentChatId);
                if(c) { c.messages = []; c.title = 'New Chat'; saveAndRender(); }
            };
            document.getElementById('sendBtn').onclick = sendMessage;
            document.getElementById('stopBtn').onclick = () => { if(activeAbortController) activeAbortController.abort(); };
            document.getElementById('messageInput').onkeydown = (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
        });
    </script>
</body>
</html>
