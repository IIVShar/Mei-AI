<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal AI Chat</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gemini: {
                            bg: '#f0f4f9',
                            sidebar: '#e9eef6',
                            userBubble: '#e3e3e3',
                            accent: '#1a73e8'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Modern, minimal scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Markdown Styling */
        .markdown-body pre { background: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.75rem 0; font-size: 0.875rem; }
        .markdown-body code { font-family: monospace; background: #e2e8f0; padding: 0.125rem 0.25rem; border-radius: 0.25rem; color: #ef4444; }
        .markdown-body pre code { background: transparent; padding: 0; color: inherit; }
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.6; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        
        /* Hide sidebar on mobile by default */
        @media (max-width: 768px) {
            #sidebar { transform: translateX(-100%); transition: transform 0.3s ease; position: absolute; z-index: 40; height: 100%; }
            #sidebar.open { transform: translateX(0); }
            #overlay.open { display: block; }
        }
    </style>
</head>
<body class="bg-white text-gray-800 h-screen flex overflow-hidden font-sans">

    <!-- Mobile Overlay -->
    <div id="overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-30 lg:hidden" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 bg-gemini-sidebar flex flex-col flex-shrink-0 border-r border-gray-200">
        <div class="p-4 flex items-center justify-between">
            <button onclick="toggleSidebar()" class="lg:hidden text-gray-600 hover:bg-gray-200 p-2 rounded-full transition">
                <i class="fa-solid fa-bars"></i>
            </button>
            <button onclick="startNewChat()" class="flex-1 ml-2 lg:ml-0 flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow-sm hover:shadow-md transition text-sm font-medium border border-gray-200">
                <i class="fa-solid fa-plus text-gemini-accent"></i> New chat
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-3">
            <div class="text-xs font-semibold text-gray-500 mb-2 px-2">Recent</div>
            <ul id="historyList" class="space-y-1">
                <!-- Chat history dynamically populated -->
            </ul>
        </div>

        <div class="p-4 border-t border-gray-200">
            <button onclick="openSettings()" class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-200 rounded-lg transition">
                <i class="fa-solid fa-cog"></i> Settings
            </button>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col h-full relative">
        <!-- Header -->
        <header class="h-14 flex items-center justify-between px-4 lg:px-8 border-b border-gray-100 bg-white/80 backdrop-blur-md z-10">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="text-gray-600 hover:bg-gray-100 p-2 rounded-full transition lg:hidden">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h1 class="text-lg font-medium text-gray-600">Universal AI</h1>
                <span id="currentModelBadge" class="hidden md:inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-800 border border-blue-200">
                    No Model Set
                </span>
            </div>
            <div class="w-8 h-8 rounded-full bg-gemini-accent text-white flex items-center justify-center font-bold text-sm shadow-sm">
                U
            </div>
        </header>

        <!-- Messages Container -->
        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 lg:p-8 scroll-smooth pb-32">
            <!-- Messages dynamically populated here -->
            <div id="emptyState" class="h-full flex flex-col items-center justify-center text-center max-w-2xl mx-auto opacity-50">
                <i class="fa-brands fa-bots text-6xl mb-4 text-gray-300"></i>
                <h2 class="text-2xl font-semibold mb-2">How can I help you today?</h2>
                <p class="text-sm">Configure your OpenRouter API key in settings to get started.</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="absolute bottom-0 left-0 right-0 p-4 lg:p-6 bg-gradient-to-t from-white via-white to-transparent">
            <div class="max-w-4xl mx-auto relative flex items-end bg-gemini-bg rounded-3xl border border-gray-200 shadow-sm focus-within:shadow-md focus-within:bg-white transition-all overflow-hidden p-2">
                <textarea 
                    id="messageInput" 
                    rows="1" 
                    placeholder="Enter a prompt here..."
                    class="w-full max-h-48 resize-none bg-transparent border-none focus:ring-0 text-gray-800 p-3 outline-none"
                    oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"
                    onkeydown="handleEnter(event)"></textarea>
                <button id="sendBtn" onclick="sendMessage()" class="p-3 m-1 text-gemini-accent hover:bg-gray-200 rounded-full transition flex-shrink-0 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
            <p class="text-xs text-center text-gray-400 mt-3">AI can make mistakes. Consider verifying important information.</p>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden transform transition-all">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-gray-800">Configuration</h3>
                <button onclick="closeSettings()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">OpenRouter API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="sk-or-v1-..." class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-gemini-accent focus:ring-1 focus:ring-gemini-accent transition text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Model Name</label>
                    <input type="text" id="modelInput" placeholder="e.g. google/gemini-pro" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-gemini-accent focus:ring-1 focus:ring-gemini-accent transition text-sm">
                    <p class="text-xs text-gray-500 mt-1">Default: google/gemini-2.5-pro</p>
                </div>
            </div>
            <div class="p-4 bg-gray-50 flex justify-end gap-2">
                <button onclick="closeSettings()" class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-200 rounded-lg transition">Cancel</button>
                <button onclick="saveSettings()" class="px-4 py-2 text-sm font-medium text-white bg-gemini-accent hover:bg-blue-700 rounded-lg transition">Save</button>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        // --- State Management ---
        let appState = {
            apiKey: localStorage.getItem('ai_api_key') || '',
            modelName: localStorage.getItem('ai_model_name') || 'google/gemini-2.5-pro',
            chats: JSON.parse(localStorage.getItem('ai_chats')) || [],
            currentChatId: null
        };

        // --- DOM Elements ---
        const els = {
            sidebar: document.getElementById('sidebar'),
            overlay: document.getElementById('overlay'),
            historyList: document.getElementById('historyList'),
            chatContainer: document.getElementById('chatContainer'),
            emptyState: document.getElementById('emptyState'),
            messageInput: document.getElementById('messageInput'),
            sendBtn: document.getElementById('sendBtn'),
            settingsModal: document.getElementById('settingsModal'),
            apiKeyInput: document.getElementById('apiKeyInput'),
            modelInput: document.getElementById('modelInput'),
            currentModelBadge: document.getElementById('currentModelBadge')
        };

        // --- Initialization ---
        function init() {
            updateModelBadge();
            if (appState.chats.length === 0) {
                startNewChat(false);
            } else {
                appState.currentChatId = appState.chats[0].id;
                renderHistory();
                renderChat(appState.currentChatId);
            }
        }

        // --- UI & Interaction ---
        function toggleSidebar() {
            els.sidebar.classList.toggle('open');
            els.overlay.classList.toggle('open');
        }

        function openSettings() {
            els.apiKeyInput.value = appState.apiKey;
            els.modelInput.value = appState.modelName;
            els.settingsModal.classList.remove('hidden');
        }

        function closeSettings() {
            els.settingsModal.classList.add('hidden');
        }

        function saveSettings() {
            appState.apiKey = els.apiKeyInput.value.trim();
            appState.modelName = els.modelInput.value.trim() || 'google/gemini-2.5-pro';
            
            localStorage.setItem('ai_api_key', appState.apiKey);
            localStorage.setItem('ai_model_name', appState.modelName);
            
            updateModelBadge();
            closeSettings();
        }

        function updateModelBadge() {
            els.currentModelBadge.textContent = appState.modelName;
            els.currentModelBadge.classList.toggle('hidden', !appState.modelName);
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function scrollToBottom() {
            els.chatContainer.scrollTop = els.chatContainer.scrollHeight;
        }

        // --- Chat Management ---
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function saveChatsToStorage() {
            localStorage.setItem('ai_chats', JSON.stringify(appState.chats));
            renderHistory();
        }

        function startNewChat(render = true) {
            const newChat = {
                id: generateId(),
                title: 'New Chat',
                messages: [],
                updatedAt: Date.now()
            };
            appState.chats.unshift(newChat);
            appState.currentChatId = newChat.id;
            saveChatsToStorage();
            if (render) renderChat(newChat.id);
            if (window.innerWidth <= 768) toggleSidebar(); // Close sidebar on mobile
        }

        function switchChat(chatId) {
            appState.currentChatId = chatId;
            renderChat(chatId);
            if (window.innerWidth <= 768) toggleSidebar();
        }

        function renderHistory() {
            els.historyList.innerHTML = appState.chats.map(chat => `
                <li>
                    <button onclick="switchChat('${chat.id}')" class="w-full text-left px-3 py-2 rounded-lg text-sm truncate transition ${chat.id === appState.currentChatId ? 'bg-blue-50 text-gemini-accent font-medium' : 'text-gray-600 hover:bg-gray-200'}">
                        <i class="fa-regular fa-message mr-2 opacity-70"></i> ${chat.title}
                    </button>
                </li>
            `).join('');
        }

        function renderChat(chatId) {
            renderHistory(); // update active state
            const chat = appState.chats.find(c => c.id === chatId);
            
            // Clear current messages
            Array.from(els.chatContainer.children).forEach(child => {
                if (child.id !== 'emptyState') child.remove();
            });

            if (!chat || chat.messages.length === 0) {
                els.emptyState.classList.remove('hidden');
                return;
            }

            els.emptyState.classList.add('hidden');
            chat.messages.forEach(msg => appendMessageUI(msg.role, msg.content));
            scrollToBottom();
        }

        function appendMessageUI(role, content) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex gap-4 mb-6 max-w-4xl mx-auto w-full animate-fade-in`;
            
            if (role === 'user') {
                msgDiv.innerHTML = `
                    <div class="flex-1 flex justify-end">
                        <div class="bg-gemini-userBubble text-gray-800 px-5 py-3 rounded-2xl rounded-tr-sm max-w-[85%] text-sm whitespace-pre-wrap">${escapeHTML(content)}</div>
                    </div>
                `;
            } else {
                const parsedContent = marked.parse(content);
                msgDiv.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex-shrink-0 flex items-center justify-center shadow-sm">
                        <i class="fa-solid fa-sparkles text-white text-xs"></i>
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <div class="markdown-body text-gray-800 text-sm">${parsedContent}</div>
                    </div>
                `;
            }
            els.chatContainer.appendChild(msgDiv);
        }

        function appendLoadingUI() {
            const loaderId = 'loader-' + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.id = loaderId;
            msgDiv.className = `flex gap-4 mb-6 max-w-4xl mx-auto w-full`;
            msgDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex-shrink-0 flex items-center justify-center animate-pulse">
                    <i class="fa-solid fa-sparkles text-white text-xs"></i>
                </div>
                <div class="flex-1 flex items-center">
                    <div class="flex space-x-1">
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0ms"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
                    </div>
                </div>
            `;
            els.chatContainer.appendChild(msgDiv);
            scrollToBottom();
            return loaderId;
        }

        // --- API Integration ---
        async function sendMessage() {
            const content = els.messageInput.value.trim();
            if (!content) return;

            if (!appState.apiKey) {
                alert("Please configure your OpenRouter API Key in settings first.");
                openSettings();
                return;
            }

            // Get/Create Active Chat
            let chat = appState.chats.find(c => c.id === appState.currentChatId);
            if (!chat) {
                startNewChat(false);
                chat = appState.chats[0];
            }

            // Update UI & State for User Message
            els.emptyState.classList.add('hidden');
            els.messageInput.value = '';
            els.messageInput.style.height = '';
            els.sendBtn.disabled = true;
            
            chat.messages.push({ role: 'user', content: content });
            chat.updatedAt = Date.now();
            
            // Auto-generate title for first message
            if (chat.messages.length === 1) {
                chat.title = content.substring(0, 30) + (content.length > 30 ? '...' : '');
            }
            
            saveChatsToStorage();
            appendMessageUI('user', content);
            scrollToBottom();

            const loaderId = appendLoadingUI();

            // Prepare API Request
            try {
                // Ensure format required by OpenAI-compatible endpoints
                const apiMessages = chat.messages.map(m => ({ role: m.role, content: m.content }));
                
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${appState.apiKey}`,
                        "HTTP-Referer": window.location.href,
                        "X-Title": "Universal AI Static Client",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: appState.modelName,
                        messages: apiMessages
                    })
                });

                document.getElementById(loaderId).remove();

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const aiResponse = data.choices[0].message.content;

                // Update State & UI for AI Response
                chat.messages.push({ role: 'assistant', content: aiResponse });
                saveChatsToStorage();
                appendMessageUI('assistant', aiResponse);

            } catch (error) {
                document.getElementById(loaderId)?.remove();
                console.error("API Error:", error);
                
                const errorMsg = `**Error:** ${error.message}\n\nPlease check your API key and model name in settings.`;
                chat.messages.push({ role: 'assistant', content: errorMsg });
                saveChatsToStorage();
                appendMessageUI('assistant', errorMsg);
            } finally {
                els.sendBtn.disabled = false;
                els.messageInput.focus();
                scrollToBottom();
            }
        }

        // Utility: Basic HTML escape to prevent XSS in user bubble
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }

        // Add tailwind fade-in animation manually
        document.head.insertAdjacentHTML('beforeend', `<style>
            @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
            .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        </style>`);

        // Boot
        init();
    </script>
</body>
</html>
