<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal AI Chat</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* Custom scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #4B5563;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #6B7280;
    }
    .prose p { margin-bottom: 0.75rem; }
    .prose p:last-child { margin-bottom: 0; }
    .prose pre { background-color: #1f2937; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-top: 0.5rem; margin-bottom: 0.5rem; }
    .prose code { background-color: rgba(255,255,255,0.1); padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-size: 0.875em; }
    .prose pre code { background-color: transparent; padding: 0; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 h-full flex overflow-hidden font-sans antialiased">

  <!-- Mobile Sidebar Backdrop -->
  <div id="sidebarBackdrop" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-64 bg-gray-950 border-r border-gray-800 flex flex-col transition-transform duration-300 transform -translate-x-full md:translate-x-0">
    <!-- Top Action Header -->
    <div class="p-4 flex items-center justify-between gap-2 border-b border-gray-800">
      <button id="btnNewChat" class="flex-1 flex items-center justify-center gap-2 bg-gray-800 hover:bg-gray-700 text-gray-200 py-2.5 px-4 rounded-xl text-sm font-medium transition-colors border border-gray-700">
        <i class="fa-solid fa-plus text-xs"></i> New Chat
      </button>
      <button id="btnCloseMobileSidebar" class="md:hidden p-2 text-gray-400 hover:text-white rounded-lg">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <!-- Chat History List -->
    <div class="flex-1 overflow-y-auto p-3 space-y-1" id="chatHistoryList">
      <!-- Dynamically Rendered History Items -->
    </div>

    <!-- Bottom Settings Bar -->
    <div class="p-3 border-t border-gray-800">
      <button id="btnOpenSettings" class="w-full flex items-center gap-3 px-3 py-2.5 text-gray-400 hover:text-gray-100 hover:bg-gray-800/60 rounded-xl text-sm transition-colors">
        <i class="fa-solid fa-gear text-base"></i>
        <span class="font-medium">Settings</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col min-w-0 bg-gray-900 relative">
    
    <!-- Top Bar Header -->
    <header class="h-14 border-b border-gray-800/80 flex items-center justify-between px-4 bg-gray-900/50 backdrop-blur">
      <div class="flex items-center gap-3">
        <button id="btnToggleMobileSidebar" class="md:hidden p-2 text-gray-400 hover:text-white rounded-lg">
          <i class="fa-solid fa-bars text-lg"></i>
        </button>
        <span id="currentModelDisplay" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-gray-800 text-blue-400 border border-gray-700">
          google/gemini-2.5-flash
        </span>
      </div>
      <button id="btnClearCurrentChat" title="Clear Chat" class="p-2 text-gray-400 hover:text-red-400 rounded-lg transition-colors">
        <i class="fa-regular fa-trash-can text-sm"></i>
      </button>
    </header>

    <!-- Chat Messages Container -->
    <div id="chatContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-4xl w-full mx-auto">
      <!-- Empty State / Welcome Screen -->
      <div id="welcomeState" class="h-full flex flex-col items-center justify-center text-center p-6 space-y-4 my-auto">
        <div class="w-16 h-16 bg-blue-600/10 text-blue-500 rounded-2xl flex items-center justify-center text-3xl mb-2 border border-blue-500/20">
          <i class="fa-solid fa-sparkles"></i>
        </div>
        <h1 class="text-2xl md:text-3xl font-semibold text-gray-100">Where modern AI meets clean code</h1>
        <p class="text-gray-400 max-w-md text-sm">Enter your OpenRouter API key in settings to start chatting with Google Gemini or any supported model.</p>
      </div>
    </div>

    <!-- Input Area -->
    <div class="p-4 bg-gray-900 border-t border-gray-800/50">
      <div class="max-w-4xl mx-auto relative">
        <form id="chatForm" class="flex items-end gap-2 bg-gray-800/90 border border-gray-700 focus-within:border-blue-500/80 rounded-2xl p-2 transition-all shadow-lg">
          <textarea 
            id="userInput" 
            rows="1" 
            placeholder="Ask anything..." 
            class="w-full bg-transparent text-gray-100 placeholder-gray-500 px-3 py-2 resize-none focus:outline-none max-h-48 text-sm md:text-base scrollbar-none"
          ></textarea>
          <button 
            type="submit" 
            id="btnSend"
            class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-xl transition-colors disabled:opacity-40 disabled:hover:bg-blue-600 flex-shrink-0"
          >
            <i class="fa-solid fa-paper-plane text-sm"></i>
          </button>
        </form>
        <p class="text-center text-xs text-gray-500 mt-2">Powered by OpenRouter API &bull; Local Storage Saved</p>
      </div>
    </div>
  </main>

  <!-- Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm">
    <div class="bg-gray-800 rounded-2xl max-w-md w-full p-6 border border-gray-700 shadow-2xl relative">
      <div class="flex justify-between items-center mb-5">
        <h2 class="text-lg font-semibold text-white flex items-center gap-2">
          <i class="fa-solid fa-sliders text-blue-400"></i> Settings
        </h2>
        <button id="btnCloseSettings" class="text-gray-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1.5">OpenRouter API Key</label>
          <input 
            type="password" 
            id="apiKeyInput" 
            placeholder="sk-or-v1-..." 
            class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3.5 py-2.5 text-sm text-gray-100 focus:outline-none focus:border-blue-500"
          />
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1.5">Model Identifier</label>
          <input 
            type="text" 
            id="modelInput" 
            placeholder="google/gemini-2.5-flash" 
            class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3.5 py-2.5 text-sm text-gray-100 focus:outline-none focus:border-blue-500"
          />
          <p class="text-xs text-gray-500 mt-1">Default: <code>google/gemini-2.5-flash</code></p>
        </div>
      </div>

      <div class="mt-6 flex justify-end gap-3">
        <button id="btnSaveSettings" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl text-sm transition-colors">
          Save Preferences
        </button>
      </div>
    </div>
  </div>

  <!-- JavaScript Logic placed strictly at the bottom -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // API & State Storage Keys
      const STORAGE_KEY_SETTINGS = 'uai_settings';
      const STORAGE_KEY_CHATS = 'uai_chats';
      const STORAGE_KEY_ACTIVE_ID = 'uai_active_chat_id';

      // Default State
      let settings = JSON.parse(localStorage.getItem(STORAGE_KEY_SETTINGS)) || {
        apiKey: '',
        model: 'google/gemini-2.5-flash'
      };
      
      let chats = JSON.parse(localStorage.getItem(STORAGE_KEY_CHATS)) || [];
      let activeChatId = localStorage.getItem(STORAGE_KEY_ACTIVE_ID) || null;
      let isGenerating = false;

      // DOM Elements
      const sidebar = document.getElementById('sidebar');
      const sidebarBackdrop = document.getElementById('sidebarBackdrop');
      const btnToggleMobileSidebar = document.getElementById('btnToggleMobileSidebar');
      const btnCloseMobileSidebar = document.getElementById('btnCloseMobileSidebar');
      const btnNewChat = document.getElementById('btnNewChat');
      const chatHistoryList = document.getElementById('chatHistoryList');
      const btnOpenSettings = document.getElementById('btnOpenSettings');
      const btnCloseSettings = document.getElementById('btnCloseSettings');
      const settingsModal = document.getElementById('settingsModal');
      const apiKeyInput = document.getElementById('apiKeyInput');
      const modelInput = document.getElementById('modelInput');
      const btnSaveSettings = document.getElementById('btnSaveSettings');
      const currentModelDisplay = document.getElementById('currentModelDisplay');
      const chatContainer = document.getElementById('chatContainer');
      const welcomeState = document.getElementById('welcomeState');
      const chatForm = document.getElementById('chatForm');
      const userInput = document.getElementById('userInput');
      const btnSend = document.getElementById('btnSend');
      const btnClearCurrentChat = document.getElementById('btnClearCurrentChat');

      // Initialize Application
      function init() {
        // Load Settings into UI
        apiKeyInput.value = settings.apiKey;
        modelInput.value = settings.model;
        currentModelDisplay.textContent = settings.model || 'google/gemini-2.5-flash';

        // Ensure active chat exists or setup initial view
        if (chats.length > 0) {
          if (!activeChatId || !chats.find(c => c.id === activeChatId)) {
            activeChatId = chats[0].id;
          }
        } else {
          createNewChat(false);
        }

        renderSidebarHistory();
        renderActiveChat();
        setupAutoResizeTextarea();
      }

      // Save State Helpers
      function saveSettings() {
        settings.apiKey = apiKeyInput.value.trim();
        settings.model = modelInput.value.trim() || 'google/gemini-2.5-flash';
        localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
        currentModelDisplay.textContent = settings.model;
        settingsModal.classList.add('hidden');
      }

      function saveChats() {
        localStorage.setItem(STORAGE_KEY_CHATS, JSON.stringify(chats));
        localStorage.setItem(STORAGE_KEY_ACTIVE_ID, activeChatId);
      }

      // Chat Management
      function createNewChat(switchToIt = true) {
        const newChat = {
          id: 'chat_' + Date.now(),
          title: 'New Chat',
          messages: [],
          createdAt: Date.now()
        };
        chats.unshift(newChat);
        if (switchToIt) {
          activeChatId = newChat.id;
        }
        saveChats();
        renderSidebarHistory();
        renderActiveChat();
        if (window.innerWidth < 768) closeSidebar();
      }

      function deleteChat(id, event) {
        event.stopPropagation();
        chats = chats.filter(c => c.id !== id);
        if (activeChatId === id) {
          activeChatId = chats.length > 0 ? chats[0].id : null;
        }
        if (chats.length === 0) {
          createNewChat(false);
        }
        saveChats();
        renderSidebarHistory();
        renderActiveChat();
      }

      function switchChat(id) {
        if (isGenerating) return;
        activeChatId = id;
        saveChats();
        renderSidebarHistory();
        renderActiveChat();
        if (window.innerWidth < 768) closeSidebar();
      }

      // Sidebar Rendering
      function renderSidebarHistory() {
        chatHistoryList.innerHTML = '';
        chats.forEach(chat => {
          const isActive = chat.id === activeChatId;
          const btn = document.createElement('div');
          btn.className = `group flex items-center justify-between px-3 py-2.5 rounded-xl cursor-pointer text-sm transition-colors ${
            isActive ? 'bg-gray-800 text-white font-medium' : 'text-gray-400 hover:bg-gray-800/50 hover:text-gray-200'
          }`;
          btn.onclick = () => switchChat(chat.id);

          btn.innerHTML = `
            <div class="flex items-center gap-2.5 min-w-0 flex-1">
              <i class="fa-regular fa-message text-xs opacity-70"></i>
              <span class="truncate">${escapeHtml(chat.title)}</span>
            </div>
            <button class="btn-delete opacity-0 group-hover:opacity-100 p-1 text-gray-500 hover:text-red-400 transition-opacity">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          `;

          btn.querySelector('.btn-delete').onclick = (e) => deleteChat(chat.id, e);
          chatHistoryList.appendChild(btn);
        });
      }

      // Chat UI Rendering
      function renderActiveChat() {
        const activeChat = chats.find(c => c.id === activeChatId);
        chatContainer.innerHTML = '';

        if (!activeChat || activeChat.messages.length === 0) {
          chatContainer.appendChild(welcomeState);
          welcomeState.classList.remove('hidden');
          return;
        }

        welcomeState.classList.add('hidden');
        activeChat.messages.forEach(msg => appendMessageUI(msg.role, msg.content));
        scrollToBottom();
      }

      function appendMessageUI(role, content) {
        welcomeState.classList.add('hidden');
        const isUser = role === 'user';
        const wrapper = document.createElement('div');
        wrapper.className = `flex gap-3 md:gap-4 ${isUser ? 'justify-end' : 'justify-start'}`;

        const parsedContent = isUser ? escapeHtml(content) : marked.parse(content);

        wrapper.innerHTML = `
          ${!isUser ? `
            <div class="w-8 h-8 rounded-full bg-blue-600/20 text-blue-400 border border-blue-500/30 flex items-center justify-center text-xs flex-shrink-0 mt-1">
              <i class="fa-solid fa-sparkles"></i>
            </div>
          ` : ''}
          <div class="max-w-[85%] md:max-w-[75%] rounded-2xl px-4 py-3 ${
            isUser 
              ? 'bg-blue-600 text-white rounded-br-xs' 
              : 'bg-gray-800 text-gray-100 border border-gray-700/60 rounded-bl-xs prose prose-invert text-sm md:text-base'
          }">
            <div class="message-body">${parsedContent}</div>
          </div>
          ${isUser ? `
            <div class="w-8 h-8 rounded-full bg-gray-700 text-gray-300 flex items-center justify-center text-xs flex-shrink-0 mt-1">
              <i class="fa-solid fa-user"></i>
            </div>
          ` : ''}
        `;

        chatContainer.appendChild(wrapper);
        scrollToBottom();
        return wrapper.querySelector('.message-body');
      }

      // Auto-resize Textarea
      function setupAutoResizeTextarea() {
        userInput.addEventListener('input', function() {
          this.style.height = 'auto';
          this.style.height = (this.scrollHeight) + 'px';
        });
      }

      function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
      }

      // OpenRouter API Streaming Submission
      async function handleChatSubmit(e) {
        e.preventDefault();
        const query = userInput.value.trim();
        if (!query || isGenerating) return;

        if (!settings.apiKey) {
          alert('Please enter your OpenRouter API Key in the Settings menu first.');
          settingsModal.classList.remove('hidden');
          return;
        }

        const activeChat = chats.find(c => c.id === activeChatId);
        if (!activeChat) return;

        // Dynamic Title Generation for First Message
        if (activeChat.messages.length === 0) {
          activeChat.title = query.length > 25 ? query.substring(0, 25) + '...' : query;
          renderSidebarHistory();
        }

        // Append User Message
        activeChat.messages.push({ role: 'user', content: query });
        appendMessageUI('user', query);

        userInput.value = '';
        userInput.style.height = 'auto';
        isGenerating = true;
        btnSend.disabled = true;

        // Placeholder for Assistant Response
        const assistantTextContainer = appendMessageUI('assistant', '<i class="fa-solid fa-ellipsis fa-bounce text-gray-400"></i>');
        
        try {
          const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${settings.apiKey}`,
              'Content-Type': 'application/json',
              'HTTP-Referer': window.location.origin || 'http://localhost',
              'X-Title': 'Universal AI Static Client'
            },
            body: JSON.stringify({
              model: settings.model || 'google/gemini-2.5-flash',
              messages: activeChat.messages.map(m => ({ role: m.role, content: m.content })),
              stream: true
            })
          });

          if (!response.ok) {
            const errData = await response.json();
            throw new Error(errData.error?.message || `HTTP Error ${response.status}`);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let fullContent = '';
          assistantTextContainer.innerHTML = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value, { stream: true });
            const lines = chunk.split('\n').filter(line => line.trim() !== '');

            for (const line of lines) {
              if (line.startsWith('data: ')) {
                const dataStr = line.replace('data: ', '').trim();
                if (dataStr === '[DONE]') break;

                try {
                  const data = JSON.parse(dataStr);
                  const token = data.choices[0]?.delta?.content || '';
                  fullContent += token;
                  assistantTextContainer.innerHTML = marked.parse(fullContent);
                  scrollToBottom();
                } catch (err) {
                  // Ignore JSON parse errors for incomplete streaming chunks
                }
              }
            }
          }

          activeChat.messages.push({ role: 'assistant', content: fullContent });
          saveChats();

        } catch (error) {
          console.error(error);
          assistantTextContainer.innerHTML = `<span class="text-red-400 font-medium">Error: ${escapeHtml(error.message)}</span>`;
        } finally {
          isGenerating = false;
          btnSend.disabled = false;
        }
      }

      // Sidebar Toggle Logic
      function openSidebar() {
        sidebar.classList.remove('-translate-x-full');
        sidebarBackdrop.classList.remove('hidden');
      }

      function closeSidebar() {
        sidebar.classList.add('-translate-x-full');
        sidebarBackdrop.classList.add('hidden');
      }

      // Event Listeners
      chatForm.addEventListener('submit', handleChatSubmit);
      userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          chatForm.dispatchEvent(new Event('submit'));
        }
      });

      btnNewChat.addEventListener('click', () => createNewChat(true));
      btnOpenSettings.addEventListener('click', () => settingsModal.classList.remove('hidden'));
      btnCloseSettings.addEventListener('click', () => settingsModal.classList.add('hidden'));
      btnSaveSettings.addEventListener('click', saveSettings);

      btnClearCurrentChat.addEventListener('click', () => {
        if (!activeChatId) return;
        const activeChat = chats.find(c => c.id === activeChatId);
        if (activeChat && confirm('Are you sure you want to clear this conversation?')) {
          activeChat.messages = [];
          saveChats();
          renderActiveChat();
        }
      });

      btnToggleMobileSidebar.addEventListener('click', openSidebar);
      btnCloseMobileSidebar.addEventListener('click', closeSidebar);
      sidebarBackdrop.addEventListener('click', closeSidebar);

      // Start App
      init();
    });
  </script>
</body>
</html>
