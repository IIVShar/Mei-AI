<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal AI Chat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        geminiDark: '#131314',
                        geminiSidebar: '#1e1f20',
                        geminiMessageUser: '#2a2b2c',
                        geminiMessageAi: '#131314'
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for a cleaner UI */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        /* Auto-resizing textarea */
        textarea { resize: none; overflow: hidden; }
    </style>
</head>
<body class="bg-geminiDark text-gray-200 h-screen w-screen overflow-hidden flex selection:bg-blue-500 selection:text-white">

    <!-- Sidebar -->
    <aside id="sidebar" class="bg-geminiSidebar w-72 flex-shrink-0 flex flex-col h-full border-r border-gray-800 transition-transform duration-300 transform -translate-x-full md:translate-x-0 absolute md:relative z-20">
        <div class="p-4 flex items-center justify-between">
            <h1 class="text-xl font-semibold tracking-wide">Chats</h1>
            <button id="closeSidebarBtn" class="md:hidden text-gray-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <div class="px-4 pb-4">
            <button id="newChatBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg flex items-center justify-center gap-2 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                New Chat
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-2 space-y-1" id="chatHistoryList">
            <!-- Chat history items will be injected here -->
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col h-full relative">
        <!-- Header -->
        <header class="h-16 flex items-center justify-between px-4 border-b border-gray-800 bg-geminiDark z-10">
            <div class="flex items-center gap-3">
                <button id="openSidebarBtn" class="md:hidden text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <h2 class="text-lg font-medium text-gray-300">Universal AI</h2>
            </div>
            <button id="openSettingsBtn" class="p-2 text-gray-400 hover:text-white hover:bg-gray-800 rounded-full transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </header>

        <!-- Chat Container -->
        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">
            <!-- Messages will be injected here -->
            <div id="emptyState" class="h-full flex flex-col items-center justify-center text-gray-500">
                <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                <p class="text-lg">How can I help you today?</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 md:px-8 pb-6 bg-geminiDark w-full max-w-4xl mx-auto">
            <form id="chatForm" class="relative flex items-end gap-2 bg-geminiMessageUser border border-gray-700 rounded-2xl p-2 focus-within:ring-1 focus-within:ring-blue-500 focus-within:border-blue-500 transition-all shadow-lg">
                <textarea id="userInput" rows="1" placeholder="Type a message..." class="w-full bg-transparent text-gray-100 p-3 max-h-48 focus:outline-none resize-none leading-relaxed" required></textarea>
                <button type="submit" id="sendBtn" class="p-3 text-gray-400 hover:text-white hover:bg-gray-700 rounded-xl transition-colors mb-0.5">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </form>
            <p class="text-xs text-center text-gray-500 mt-3">AI can make mistakes. Verify important information.</p>
        </div>
    </main>

    <!-- Settings Modal Overlay -->
    <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm hidden z-50 flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-geminiSidebar border border-gray-700 w-full max-w-md rounded-2xl shadow-2xl p-6 transform scale-95 transition-transform duration-300" id="settingsBox">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-white">Settings</h3>
                <button id="closeSettingsBtn" class="text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">OpenRouter API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="sk-or-v1-..." class="w-full bg-geminiDark border border-gray-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    <p class="text-xs text-gray-500 mt-1">Stored securely in your browser's local storage.</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Model Name</label>
                    <input type="text" id="modelInput" placeholder="google/gemini-pro" value="google/gemini-pro" class="w-full bg-geminiDark border border-gray-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    <p class="text-xs text-gray-500 mt-1">e.g., openai/gpt-4-turbo, anthropic/claude-3-opus</p>
                </div>
            </div>

            <div class="mt-8 flex justify-end gap-3">
                <button id="cancelSettingsBtn" class="px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-800 transition-colors">Cancel</button>
                <button id="saveSettingsBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors">Save Details</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT AT THE END OF BODY -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // === State Management ===
            let chats = JSON.parse(localStorage.getItem('universalAiChats')) || [];
            let currentChatId = null;
            let apiKey = localStorage.getItem('openRouterApiKey') || '';
            let modelName = localStorage.getItem('openRouterModel') || 'google/gemini-pro';

            // === DOM Elements ===
            const elements = {
                sidebar: document.getElementById('sidebar'),
                openSidebarBtn: document.getElementById('openSidebarBtn'),
                closeSidebarBtn: document.getElementById('closeSidebarBtn'),
                newChatBtn: document.getElementById('newChatBtn'),
                chatHistoryList: document.getElementById('chatHistoryList'),
                chatContainer: document.getElementById('chatContainer'),
                emptyState: document.getElementById('emptyState'),
                chatForm: document.getElementById('chatForm'),
                userInput: document.getElementById('userInput'),
                sendBtn: document.getElementById('sendBtn'),
                settingsModal: document.getElementById('settingsModal'),
                settingsBox: document.getElementById('settingsBox'),
                openSettingsBtn: document.getElementById('openSettingsBtn'),
                closeSettingsBtn: document.getElementById('closeSettingsBtn'),
                cancelSettingsBtn: document.getElementById('cancelSettingsBtn'),
                saveSettingsBtn: document.getElementById('saveSettingsBtn'),
                apiKeyInput: document.getElementById('apiKeyInput'),
                modelInput: document.getElementById('modelInput')
            };

            // === Initialization ===
            renderChatHistory();
            if (chats.length > 0) {
                loadChat(chats[0].id);
            }

            // === Sidebar Mobile Toggle ===
            elements.openSidebarBtn.addEventListener('click', () => {
                elements.sidebar.classList.remove('-translate-x-full');
            });
            elements.closeSidebarBtn.addEventListener('click', () => {
                elements.sidebar.classList.add('-translate-x-full');
            });

            // === Settings Modal Logic ===
            const openSettings = () => {
                elements.apiKeyInput.value = apiKey;
                elements.modelInput.value = modelName;
                elements.settingsModal.classList.remove('hidden');
                // Trigger reflow for transition
                void elements.settingsModal.offsetWidth; 
                elements.settingsModal.classList.remove('opacity-0');
                elements.settingsBox.classList.remove('scale-95');
            };

            const closeSettings = () => {
                elements.settingsModal.classList.add('opacity-0');
                elements.settingsBox.classList.add('scale-95');
                setTimeout(() => {
                    elements.settingsModal.classList.add('hidden');
                }, 300);
            };

            elements.openSettingsBtn.addEventListener('click', openSettings);
            elements.closeSettingsBtn.addEventListener('click', closeSettings);
            elements.cancelSettingsBtn.addEventListener('click', closeSettings);
            
            elements.saveSettingsBtn.addEventListener('click', () => {
                apiKey = elements.apiKeyInput.value.trim();
                modelName = elements.modelInput.value.trim() || 'google/gemini-pro';
                
                localStorage.setItem('openRouterApiKey', apiKey);
                localStorage.setItem('openRouterModel', modelName);
                
                closeSettings();
            });

            // === Textarea Auto-resize ===
            elements.userInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
                if(this.value === '') this.style.height = 'auto';
            });

            elements.userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if(elements.userInput.value.trim()) elements.chatForm.dispatchEvent(new Event('submit'));
                }
            });

            // === Chat Logic ===
            elements.newChatBtn.addEventListener('click', () => {
                currentChatId = null;
                elements.chatContainer.innerHTML = '';
                elements.chatContainer.appendChild(elements.emptyState);
                elements.emptyState.style.display = 'flex';
                
                // Unselect all history items
                document.querySelectorAll('.history-item').forEach(el => {
                    el.classList.remove('bg-gray-800');
                });
                
                if(window.innerWidth < 768) elements.sidebar.classList.add('-translate-x-full');
            });

            elements.chatForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const text = elements.userInput.value.trim();
                if (!text) return;

                if (!apiKey) {
                    alert("Please set your OpenRouter API Key in settings first.");
                    openSettings();
                    return;
                }

                // Initialize new chat if needed
                if (!currentChatId) {
                    currentChatId = Date.now().toString();
                    chats.unshift({
                        id: currentChatId,
                        title: text.substring(0, 30) + (text.length > 30 ? '...' : ''),
                        messages: []
                    });
                }

                const currentChat = chats.find(c => c.id === currentChatId);
                
                // Add user message
                currentChat.messages.push({ role: 'user', content: text });
                appendMessage('user', text);
                
                // Reset input
                elements.userInput.value = '';
                elements.userInput.style.height = 'auto';
                elements.emptyState.style.display = 'none';
                saveChats();
                renderChatHistory();

                // Show loading indicator
                const loadingId = 'loading-' + Date.now();
                appendLoading(loadingId);

                try {
                    // Prepare messages for API (system prompt optional, mapping history)
                    const apiMessages = currentChat.messages.map(m => ({
                        role: m.role === 'ai' ? 'assistant' : 'user',
                        content: m.content
                    }));

                    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${apiKey}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: modelName,
                            messages: apiMessages
                        })
                    });

                    const data = await response.json();
                    
                    // Remove loading
                    document.getElementById(loadingId)?.remove();

                    if (data.error) {
                        throw new Error(data.error.message || "API Error");
                    }

                    const aiContent = data.choices[0].message.content;
                    currentChat.messages.push({ role: 'ai', content: aiContent });
                    appendMessage('ai', aiContent);
                    saveChats();

                } catch (error) {
                    document.getElementById(loadingId)?.remove();
                    appendMessage('ai', `**Error:** ${error.message}. Please check your API key and model name.`);
                }
            });

            // === Render Functions ===
            function saveChats() {
                localStorage.setItem('universalAiChats', JSON.stringify(chats));
            }

            function renderChatHistory() {
                elements.chatHistoryList.innerHTML = '';
                chats.forEach(chat => {
                    const btn = document.createElement('button');
                    btn.className = `history-item w-full text-left truncate px-3 py-2.5 rounded-lg text-sm transition-colors hover:bg-gray-800 text-gray-300 ${chat.id === currentChatId ? 'bg-gray-800 text-white font-medium' : ''}`;
                    btn.textContent = chat.title;
                    btn.onclick = () => {
                        loadChat(chat.id);
                        if(window.innerWidth < 768) elements.sidebar.classList.add('-translate-x-full');
                    };
                    elements.chatHistoryList.appendChild(btn);
                });
            }

            function loadChat(id) {
                currentChatId = id;
                const chat = chats.find(c => c.id === id);
                if (!chat) return;

                elements.chatContainer.innerHTML = '';
                elements.emptyState.style.display = 'none';
                
                chat.messages.forEach(msg => appendMessage(msg.role, msg.content));
                renderChatHistory();
            }

            function appendMessage(role, content) {
                const wrapper = document.createElement('div');
                wrapper.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'}`;
                
                const bubble = document.createElement('div');
                bubble.className = `max-w-3xl rounded-2xl p-4 whitespace-pre-wrap ${
                    role === 'user' 
                    ? 'bg-geminiMessageUser text-white border border-gray-800' 
                    : 'bg-transparent text-gray-100'
                }`;
                
                // Simple markdown-to-html for basic bolding and code blocks (Optional but nice)
                let formattedContent = content
                    .replace(/```([\s\S]*?)```/g, '<pre class="bg-black p-3 rounded-md overflow-x-auto my-2 text-sm text-green-400"><code>$1</code></pre>')
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>');

                if (role === 'ai') {
                    // Add AI Icon
                    const iconHTML = `<div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center flex-shrink-0 mr-3 mb-2"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg></div>`;
                    wrapper.innerHTML = `<div class="flex items-start max-w-4xl w-full">${iconHTML}<div class="flex-1 mt-1">${formattedContent}</div></div>`;
                } else {
                    bubble.innerHTML = formattedContent;
                    wrapper.appendChild(bubble);
                }

                elements.chatContainer.appendChild(wrapper);
                scrollToBottom();
            }

            function appendLoading(id) {
                const wrapper = document.createElement('div');
                wrapper.id = id;
                wrapper.className = 'flex w-full justify-start';
                wrapper.innerHTML = `
                    <div class="flex items-start max-w-4xl w-full">
                        <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center flex-shrink-0 mr-3"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg></div>
                        <div class="flex-1 mt-2 flex gap-1">
                            <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce"></div>
                            <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                            <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                        </div>
                    </div>
                `;
                elements.chatContainer.appendChild(wrapper);
                scrollToBottom();
            }

            function scrollToBottom() {
                elements.chatContainer.scrollTop = elements.chatContainer.scrollHeight;
            }
        });
    </script>
</body>
</html>
